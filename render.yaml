services:
  - type: web
    name: boqpro-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: BOQPRO_ENVIRONMENT
        value: production
      - key: BOQPRO_STORAGE_TYPE
        value: local
      - key: BOQPRO_JWT_SECRET
        generateValue: true
      - key: BOQPRO_DATABASE_URL
        value: sqlite+aiosqlite:////app/storage/boqpro.db
