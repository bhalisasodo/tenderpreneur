services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boqpro
      POSTGRES_USER: boqpro
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - boqpro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boqpro -d boqpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: boqpro
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - boqpro_minio:/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      BOQPRO_DATABASE_URL: postgresql+psycopg://boqpro:devpassword@postgres:5432/boqpro
      BOQPRO_ENVIRONMENT: production
      BOQPRO_DEBUG: "false"
      BOQPRO_STORAGE_TYPE: local
      BOQPRO_JWT_SECRET: dev-secret-key-change-in-production-must-be-32-chars-long
    ports:
      - "8000:8000"
    volumes:
      - boqpro_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - boqpro_caddy_data:/data
      - boqpro_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  boqpro_postgres:
  boqpro_minio:
  boqpro_storage:
  boqpro_caddy_data:
  boqpro_caddy_config:
