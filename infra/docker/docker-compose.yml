services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boqpro}
      POSTGRES_USER: ${POSTGRES_USER:-boqpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - boqpro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boqpro} -d ${POSTGRES_DB:-boqpro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    environment:
      BOQPRO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-boqpro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-boqpro}
      BOQPRO_ENVIRONMENT: ${BOQPRO_ENVIRONMENT:-production}
      BOQPRO_DEBUG: "false"
      BOQPRO_STORAGE_TYPE: ${BOQPRO_STORAGE_TYPE:-local}
      BOQPRO_JWT_SECRET: ${BOQPRO_JWT_SECRET:?BOQPRO_JWT_SECRET must be set}
      BOQPRO_PASSWORD_SALT: ${BOQPRO_PASSWORD_SALT:?BOQPRO_PASSWORD_SALT must be set}
      BOQPRO_APP_BASE_URL: ${BOQPRO_APP_BASE_URL:?BOQPRO_APP_BASE_URL must be set}
      BOQPRO_CORS_ORIGINS: ${BOQPRO_CORS_ORIGINS:?BOQPRO_CORS_ORIGINS must be set}
      BOQPRO_LOCAL_STORAGE_PATH: /app/storage
      BOQPRO_OBJECT_STORAGE_ENDPOINT: ${BOQPRO_OBJECT_STORAGE_ENDPOINT:-http://localhost:9000}
      BOQPRO_OBJECT_STORAGE_BUCKET: ${BOQPRO_OBJECT_STORAGE_BUCKET:-boqpro}
      BOQPRO_OBJECT_STORAGE_ACCESS_KEY: ${BOQPRO_OBJECT_STORAGE_ACCESS_KEY:-boqpro}
      BOQPRO_LLM_PROVIDER: ${BOQPRO_LLM_PROVIDER:-stub}
      BOQPRO_GEMINI_API_KEY: ${BOQPRO_GEMINI_API_KEY:-}
      BOQPRO_GEMINI_MODEL: ${BOQPRO_GEMINI_MODEL:-gemini-2.5-flash}
      BOQPRO_NOTIFICATION_PROVIDER: ${BOQPRO_NOTIFICATION_PROVIDER:-console}
      BOQPRO_PUBLIC_APP_URL: ${BOQPRO_PUBLIC_APP_URL:?BOQPRO_PUBLIC_APP_URL must be set}
      BOQPRO_SMTP_HOST: ${BOQPRO_SMTP_HOST:-}
      BOQPRO_SMTP_PORT: ${BOQPRO_SMTP_PORT:-587}
      BOQPRO_SMTP_USERNAME: ${BOQPRO_SMTP_USERNAME:-}
      BOQPRO_SMTP_PASSWORD: ${BOQPRO_SMTP_PASSWORD:-}
      BOQPRO_SMTP_USE_TLS: ${BOQPRO_SMTP_USE_TLS:-true}
      BOQPRO_SMTP_FROM_EMAIL: ${BOQPRO_SMTP_FROM_EMAIL:-noreply@boqpro.co.za}
      BOQPRO_MAX_UPLOAD_SIZE_BYTES: ${BOQPRO_MAX_UPLOAD_SIZE_BYTES:-15728640}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    volumes:
      - boqpro_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - boqpro_caddy_data:/data
      - boqpro_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  boqpro_postgres:
  boqpro_storage:
  boqpro_caddy_data:
  boqpro_caddy_config:
